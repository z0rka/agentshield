[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentshield-engine"
version = "0.1.0"
description = "AgentShield security engine: attack generation, execution and trajectory evaluation for AI agents"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# The graph nodes are pure functions; LangGraph is the orchestrator, not the logic.
# Without this extra the engine falls back to the sequential executor in
# agentshield.graph.runner, which drives the identical nodes.
graph = ["langgraph>=0.2"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
kafka = ["aiokafka>=0.12"]
llm = ["anthropic>=0.40"]
# Judge observability. Absent, `judge_sink()` returns the null sink and scans run unchanged -
# nothing in the engine requires a dashboard to exist.
langfuse = ["langfuse>=3.0"]
otel = [
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp>=1.25",
]
# 2.0 moved the server class to `mcp.server.mcpserver.MCPServer` and renamed the tool
# schema field, both of which the adapter uses. A 1.x install fails at import, so the
# floor is not cosmetic.
mcp = ["mcp>=2.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]

[tool.setuptools.packages.find]
include = ["agentshield*"]

[project.scripts]
agentshield-engine-worker = "agentshield.messaging.worker:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
